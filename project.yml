name: Blurting
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions: [en, zh-Hans, zh-Hant]
settings:
  base:
    APP_ID: com.hgsldswk.blurting
    APP_STORE_ID: ""
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  Blurting:
    type: application
    platform: iOS
    sources: [Blurting, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Blurting AppStore
    info:
      path: Blurting/Info.plist
      properties:
        CFBundleDisplayName: Blank Page Recall
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Scan notes or compare a photo of your handwritten recall.
        NSPhotoLibraryUsageDescription: Choose photos already on your device to compare handwritten recall.
        CFBundleURLTypes:
          - CFBundleURLName: com.hgsldswk.blurting.new
            CFBundleURLSchemes: [blurting]
        BlurtingProProductID: $(APP_ID).pro
        BlurtingTrialProductID: $(APP_ID).trial
        APP_STORE_ID: $(APP_STORE_ID)
  BlurtingTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BlurtingTests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  BlurtingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BlurtingUITests
        excludes: [Resources]
      - path: BlurtingUITests/Resources/paper-recall.png
        buildPhase: resources
    dependencies:
      - target: Blurting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Blurting
schemes:
  Blurting:
    build:
      targets:
        Blurting: all
        BlurtingTests: [test]
    test:
      config: Debug
      targets: [BlurtingTests]
  BlurtingUI:
    build:
      targets:
        Blurting: all
        BlurtingUITests: [test]
    test:
      config: Debug
      targets: [BlurtingUITests]
